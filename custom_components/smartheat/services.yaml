abwesend_bis:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: smartheat
          multiple: true
    bis:
      required: true
      example: "2026-12-24 18:00:00"
      selector:
        datetime:
    temperatur:
      required: false
      example: 17
      selector:
        number:
          min: 15
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
